name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DART_SDK_VERSION: '3.6.2'

jobs:
  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Build binary
        run: dart compile exe bin/ulink.dart -o ulink-macos-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ulink-macos-arm64
          path: ulink-macos-arm64

  build-macos-x64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Build binary
        run: dart compile exe bin/ulink.dart -o ulink-macos-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ulink-macos-x64
          path: ulink-macos-x64

  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Build binary
        run: dart compile exe bin/ulink.dart -o ulink-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ulink-linux-x64
          path: ulink-linux-x64

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Install dependencies
        run: dart pub get

      - name: Build binary
        run: dart compile exe bin/ulink.dart -o ulink-windows-x64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ulink-windows-x64
          path: ulink-windows-x64.exe

  release:
    needs: [build-macos-arm64, build-macos-x64, build-linux-x64, build-windows-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release versions match the tag
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          tag = os.environ['GITHUB_REF_NAME']
          expected = tag.removeprefix('v')
          pubspec = pathlib.Path('pubspec.yaml').read_text()
          version_source = pathlib.Path('lib/config/version.dart').read_text()
          versions = {
              'pubspec.yaml': re.search(r'^version: (\S+)$', pubspec, re.M).group(1),
              'lib/config/version.dart': re.search(r"static const String version = '([^']+)'", version_source).group(1),
              'npm/package.json': json.loads(pathlib.Path('npm/package.json').read_text())['version'],
          }
          mismatches = {name: version for name, version in versions.items() if version != expected}
          if mismatches:
              raise SystemExit(f'{tag} does not match release versions: {mismatches}')
          print(f'Release versions match {tag}')
          PY

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          cp artifacts/ulink-macos-arm64/ulink-macos-arm64 release/
          cp artifacts/ulink-macos-x64/ulink-macos-x64 release/
          cp artifacts/ulink-linux-x64/ulink-linux-x64 release/
          cp artifacts/ulink-windows-x64/ulink-windows-x64.exe release/
          chmod +x release/ulink-macos-arm64
          chmod +x release/ulink-macos-x64
          chmod +x release/ulink-linux-x64

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ulinkly CLI ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/ulink-macos-arm64
            release/ulink-macos-x64
            release/ulink-linux-x64
            release/ulink-windows-x64.exe
            release/checksums.txt
